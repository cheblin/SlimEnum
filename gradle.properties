group = org.unirail.SlimEnum
version = 0.0.13

pluginName = SlimEnum
pluginRepositoryUrl = https://github.com/cheblin/SlimEnum

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# No until-build cap: SlimEnum uses only stable PSI + CompletionContributor APIs,
# so it stays compatible with every future IDE build without chasing release numbers.
# The first build is the one of `platformVersion`: the plugin is compiled for the Java and the Kotlin library of that IDE.
pluginSinceBuild = 262

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
# The IDE the plugin is built against and run in. Since 2025.3 IntelliJ IDEA is one distribution: see `intellijIdea` in build.gradle.kts.
platformVersion = 2026.2.3

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# JavaScript: the TypeScript side of SlimStruct. In plugin.xml it is an optional dependency.
platformBundledPlugins = com.intellij.java, org.jetbrains.kotlin, JavaScript
platformPlugins =

# The unpacked IDEs, the local Ivy descriptors and the sandbox of `runIde` go to `.intellijPlatform` of the project.
# To keep them elsewhere, set `org.jetbrains.intellij.platform.intellijPlatformCache` and
# `org.jetbrains.intellij.platform.intellijPlatformIdesCache` in the gradle.properties of your Gradle user home.
# -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-gradle-properties.html

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
